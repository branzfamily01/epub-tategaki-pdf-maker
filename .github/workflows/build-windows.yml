name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      customer_code:
        description: 'Optional customer code for a customer-specific build'
        required: false
        default: ''
        type: string
      edition:
        description: 'Build edition label'
        required: false
        default: 'standard'
        type: string
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.14.1
      - name: Set customer build identity
        env:
          CUSTOMER_CODE: ${{ inputs.customer_code }}
          EDITION: ${{ inputs.edition }}
        run: |
          python -c "import os,pathlib; c=os.getenv('CUSTOMER_CODE') or ''; e=os.getenv('EDITION') or 'standard'; pathlib.Path('src/epub_tategaki/build_identity.py').write_text('BUILD_CUSTOMER_CODE = '+repr(c)+'\nBUILD_EDITION = '+repr(e)+'\n', encoding='utf-8')"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "*test.py" -v
      - name: Build portable exe
        run: pyinstaller --noconfirm --clean --windowed --onefile --name "EPUB-Tategaki-PDF-Maker" --paths src --add-data "manual.html;." main.py
      - name: Upload generic executable
        if: ${{ inputs.customer_code == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Tategaki-PDF-Maker-Windows
          path: dist/EPUB-Tategaki-PDF-Maker.exe
      - name: Upload customer executable
        if: ${{ inputs.customer_code != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Tategaki-PDF-Maker-${{ inputs.customer_code }}
          path: dist/EPUB-Tategaki-PDF-Maker.exe
