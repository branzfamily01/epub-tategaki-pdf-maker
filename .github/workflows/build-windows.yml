name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.14.1
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "*test.py" -v
      - name: Build portable exe
        run: pyinstaller --noconfirm --clean --windowed --onefile --name "EPUB-Tategaki-PDF-Maker" --paths src --add-data "manual.html;." main.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: EPUB-Tategaki-PDF-Maker-Windows
          path: dist/EPUB-Tategaki-PDF-Maker.exe
